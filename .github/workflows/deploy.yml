name: 自动更新美股与科创50数据

on:
  schedule:
    # 1. A股盘前全景早报：北京时间 07:46 (UTC 23:46，周日至周四对应A股周一至周五开盘)
    - cron: '46 23 * * 0-4'
    
    # 2. 午盘跨市套利：北京时间 12:42 (UTC 04:42，周一至周五)
    - cron: '42 4 * * 1-5'
    
    # 3. 美股收盘定调：北京时间 05:13 (UTC 21:13，周日至周四对应周一至周五清晨)
    - cron: '13 21 * * 0-4'

  workflow_dispatch: # 支持随时在 GitHub 网页上一键手动点击刷新！

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update-market:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 配置 Python 环境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 执行数据拉取(美股Yahoo+午盘腾讯财经+新闻RSS)并更新网页
        run: |
          python3 - << 'PY_SCRIPT'
          import json, re, time, datetime, urllib.request, urllib.parse, xml.etree.ElementTree as ET

          HEADERS_YAHOO = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36",
              "Accept": "application/json, text/plain, */*",
          }
          HEADERS_TENCENT = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/120.0.0.0",
              "Referer": "https://gu.qq.com/",
          }

          # 1. 美股与大盘指数 (精准判定昨收，杜绝误取前天价格)
          def fetch_yahoo(sym):
              url = f"https://query1.finance.yahoo.com/v8/finance/chart/{urllib.parse.quote(sym)}?interval=1d&range=5d"
              try:
                  req = urllib.request.Request(url, headers=HEADERS_YAHOO)
                  with urllib.request.urlopen(req, timeout=10) as resp:
                      data = json.loads(resp.read().decode('utf-8'))
                  meta = data["chart"]["result"][0]["meta"]
                  price = round(meta.get("regularMarketPrice", 0.0), 2)
                  
                  prev = meta.get("previousClose") or meta.get("regularMarketPreviousClose")
                  if not prev:
                      try:
                          closes = [c for c in data["chart"]["result"][0]["indicators"]["quote"][0]["close"] if c is not None]
                          if closes:
                              if len(closes) >= 2 and abs(closes[-1] - price) < 0.05:
                                  prev = closes[-2]
                              else:
                                  prev = closes[-1]
                      except Exception:
                          pass
                  
                  prev = round(prev or price, 2)
                  chg = round(price - prev, 2)
                  pct = round((chg / prev) * 100, 2) if prev and prev > 0 else 0.0
                  return {
                      "price": price, "previous_close": prev, "change": chg, "change_pct": pct,
                      "high": round(meta.get("regularMarketDayHigh", price), 2),
                      "low": round(meta.get("regularMarketDayLow", price), 2)
                  }
              except Exception:
                  return None

          # 2. 抓取雅虎财经重大要闻 RSS
          def fetch_yahoo_news():
              url = "https://feeds.finance.yahoo.com/rss/2.0/headline?s=^GSPC,NVDA,TSM,^SOX&region=US&lang=en-US"
              news_list = []
              try:
                  req = urllib.request.Request(url, headers=HEADERS_YAHOO)
                  with urllib.request.urlopen(req, timeout=8) as resp:
                      root = ET.fromstring(resp.read())
                  ch = root.find("channel")
                  if ch is not None:
                      for idx, item in enumerate(ch.findall("item")[:8]):
                          title = item.findtext("title", "")
                          pub = item.findtext("pubDate", "")[:16]
                          desc = re.sub(r'<[^>]+>', '', item.findtext("description", ""))
                          summary = desc[:180] + "..." if len(desc) > 180 else desc
                          tl = title.lower()
                          is_high = any(k in tl for k in ["fed", "rate", "cpi", "inflation", "nvidia", "tsmc", "chip", "ai", "tariff", "surge", "drop"])
                          news_list.append({
                              "id": idx + 1,
                              "impact": "HIGH" if is_high else "NORMAL",
                              "tag": "美股科技/宏观" if is_high else "市场动态",
                              "title": title,
                              "source": f"Yahoo Finance · {pub}",
                              "summary": summary or title,
                              "sentiment": "BULLISH"
                          })
              except Exception as e:
                  print(f"News fetch fallback: {e}")
              return news_list

          # 3. 午盘套利专属：接入腾讯财经极速 API (抓取港股中芯国际00981、华虹01347与科创588000)
          def fetch_tencent_arbitrage():
              url = "https://qt.gtimg.cn/q=r_hk00981,r_hk01347,sh588000"
              result = {}
              try:
                  req = urllib.request.Request(url, headers=HEADERS_TENCENT)
                  with urllib.request.urlopen(req, timeout=8) as resp:
                      text = resp.read().decode('gbk', errors='ignore')
                  for line in text.strip().split(";"):
                      if "~" in line:
                          parts = line.split("~")
                          if len(parts) > 5:
                              code = parts[2].strip()
                              curr_p = float(parts[3])
                              prev_p = float(parts[4])
                              pct = round(((curr_p - prev_p) / prev_p) * 100, 2) if prev_p else 0.0
                              result[code] = {"name": parts[1], "price": curr_p, "prev": prev_p, "pct": pct}
              except Exception as e:
                  print(f"Tencent fetch fallback: {e}")
              return result

          # 执行抓取
          symbols = {
              "indices": ["^GSPC", "^IXIC", "^DJI", "^SOX", "^VIX", "SMH", "^RUT", "PGJ"],
              "tech": ["NVDA", "TSM", "ASML", "AMD", "AVGO", "MU", "MSFT", "GOOGL", "AAPL", "QCOM"]
          }

          quotes = {}
          for s in symbols["indices"] + symbols["tech"]:
              q = fetch_yahoo(s)
              quotes[s] = q if q else {"price": 100.0, "change": 0.0, "change_pct": 0.0, "high": 101.0, "low": 99.0}

          tc_data = fetch_tencent_arbitrage()
          smic_hk = tc_data.get("00981", {"price": 27.34, "prev": 26.85, "pct": 1.82})
          hh_hk = tc_data.get("01347", {"price": 21.86, "prev": 21.40, "pct": 2.15})
          star_etf = tc_data.get("588000", {"price": 1.050, "prev": 1.035, "pct": 1.45})

          ks_quote = fetch_yahoo("^KS11")
          ks_price = ks_quote["price"] if ks_quote else 2581.9
          ks_pct = ks_quote["change_pct"] if ks_quote else 0.85

          # VIX
          vix_q = quotes.get("^VIX", {"price": 15.0, "change_pct": 0.0})
          vix_val, vix_pct = vix_q["price"], vix_q["change_pct"]
          vix_state = "极度平稳 / 低波动期" if vix_val < 15 else ("健康常态 / 情绪均衡" if vix_val < 20 else ("情绪警戒 / 波动加剧" if vix_val < 25 else "恐慌抛售 / 估值承压"))
          vix_adv = "市场情绪乐观，无系统性做空风险，科技成长股估值环境舒适。" if vix_val < 20 else "避险情绪升温，谨防盘中急跌跳水。"
          vix_analysis = {"vix_value": vix_val, "vix_change_pct": vix_pct, "state": vix_state, "advice": vix_adv}

          # 科创50次日隔夜传导
          sox_pct = quotes.get("^SOX", {}).get("change_pct", 0.0)
          nvda_pct = quotes.get("NVDA", {}).get("change_pct", 0.0)
          tsm_pct = quotes.get("TSM", {}).get("change_pct", 0.0)
          pgj_pct = quotes.get("PGJ", {}).get("change_pct", 0.0)
          lead_avg = (nvda_pct + tsm_pct) / 2.0

          score = (sox_pct * 0.40) + (lead_avg * 0.30) + (pgj_pct * 0.15)
          if vix_val > 25: score -= 0.8
          elif vix_val > 20: score -= 0.3
          gap = round(score * 0.45, 2)

          if score >= 1.5:
              verdict = "强力看多 · 逢低抢筹 (STRONG BULLISH)"
              action = "执行买入 (BUY_AGGRESSIVE)"
              strategy = "开盘集合竞价 (09:15-09:25) 重点关注半导体算力龙头高开幅度。若高开在 +1.2% 以内且封单充沛，可果断执行进攻买入；预期日内将走出共振单边多头行情。"
              risk = "防范冲高回落：若高开超 +2.5% 严禁无脑追涨，等待开盘15分钟分时回踩确认均线支撑后再行低吸。"
          elif score >= 0.5:
              verdict = "偏多震荡 · 逢低布局 (BULLISH BIAS)"
              action = "逢低低吸 (BUY_DIP)"
              strategy = "次日早盘 588000 情绪偏暖，预计温和高开 (+0.3% ~ +0.8%)。重点跟随中芯国际与澜起科技分时量能，可在盘初回踩均线时顺势建仓。"
              risk = "若早盘成交量萎缩则警惕多头动能不足，设定 1.0% 日内刚性止损位。"
          elif score > -0.5:
              verdict = "中性观望 · 保持不动 (NEUTRAL / WAIT)"
              action = "观望等待 (HOLD_WAIT)"
              strategy = "隔夜外盘外溢效应中性，588000 次日开盘受内资存量博弈主导。维持现有底仓不动，静待盘中方向确认。"
              risk = "密切关注上午 11:30 及午盘 12:40 港股半导体与韩国KOSPI走势，若午间共振则在 13:00 执行午盘套利。"
          else:
              verdict = "偏空承压 · 谨慎防守 (BEARISH BIAS)"
              action = "谨慎减仓 (DEFENSIVE)"
              strategy = "美股科技与半导体回调拖累科创板开盘情绪，预计低开。短线交易者开盘切忌盲目抄底，先行减仓防守。"
              risk = "重点观察中芯国际港股(00981.HK)早盘承接力，若跌破关键均线坚决规避。"

          star50_prediction = {
              "composite_score": round(score, 2), "expected_open_gap_pct": gap, "verdict": verdict,
              "action_code": action, "opening_strategy": strategy, "risk_alert": risk
          }

          # 赚钱效应
          tech_pcts = [quotes[s]["change_pct"] for s in symbols["tech"]]
          up_c = sum(1 for p in tech_pcts if p > 0)
          down_c = len(tech_pcts) - up_c
          avg_pct = round(sum(tech_pcts) / len(tech_pcts), 2)
          dominant_style = "进攻型成长 (High Beta Tech)" if avg_pct > 0.5 else "防御分化轮动 (Defensive / Rotation)"
          money_theme = "科技主线全面爆发，资金激进进攻" if avg_pct > 0.5 else "科技震荡分化，资金趋于防御"
          money_effect = {"avg_tech_change_pct": avg_pct, "up_count": up_c, "down_count": down_c, "dominant_style": dominant_style, "money_theme": money_theme}

          # 严格使用北京时间 (UTC+8)
          bj_now = datetime.datetime.utcnow() + datetime.timedelta(hours=8)
          now_str = bj_now.strftime("%Y-%m-%d %H:%M:%S (北京时间)")
          
          report = {
              "generated_at": now_str,
              "indices": {s: quotes[s] for s in symbols["indices"]},
              "tech_leaders": {s: quotes[s] for s in symbols["tech"]},
              "vix_analysis": vix_analysis,
              "star50_prediction": star50_prediction,
              "money_effect": money_effect,
              "news": fetch_yahoo_news(),
              "midday_arbitrage": {
                  "smic": smic_hk, "huahong": hh_hk, "star_etf": star_etf,
                  "ks11": {"price": ks_price, "pct": ks_pct}
              }
          }

          report_json = json.dumps(report, ensure_ascii=False, indent=2)

          with open("market_monitor_data.json", "w", encoding="utf-8") as f:
              f.write(report_json)

          for fn in ["index.html", "market_monitor.html"]:
              try:
                  with open(fn, "r", encoding="utf-8") as f:
                      content = f.read()
                  tag_pattern = r'<script id="embedded-data" type="application/json">.*?</script>'
                  replacement = f'<script id="embedded-data" type="application/json">\n{report_json}\n</script>'
                  if re.search(tag_pattern, content, flags=re.DOTALL):
                      content = re.sub(tag_pattern, replacement, content, flags=re.DOTALL)
                  else:
                      content = content.replace("</head>", f"  {replacement}\n</head>")
                  with open(fn, "w", encoding="utf-8") as f:
                      f.write(content)
                  print(f"Updated {fn}")
              except Exception as e:
                  print(f"Error {fn}: {e}")

          print("Successfully updated at", now_str)
          PY_SCRIPT

      - name: 提交更新并推送到 GitHub Pages
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git pull origin main --rebase || true
          git add index.html market_monitor.html market_monitor_data.json
          git commit -m "Auto update market data: $(date '+%Y-%m-%d %H:%M:%S')" || exit 0
          git push --force origin HEAD:main
